[package]
name = "deepslice"
version = "0.1.0"
edition = "2024"
description = "Auto nine-patch slicer powered by EfficientNet"
license = "MIT"

[dependencies]
anyhow = "1"
candle-core = "0.8"
candle-nn = "0.8"
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[profile.release]
lto = true
strip = true
opt-level = "s"
